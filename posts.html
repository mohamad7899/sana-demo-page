
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b1c">
  <meta name="description" content="مطالب و تازه‌ترین نوشته‌های SanaDemo">
  <title>مطالب | SanaDemo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #17265b 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #35164d 0, transparent 35%),
        #080b1c;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid #ffffff18;
      background: #080b1caa;
      backdrop-filter: blur(18px);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #fff;
    }

    .logo span {
      color: #00eaff;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: #cbd5f5;
      transition: .3s;
    }

    nav a:hover {
      color: #00eaff;
      text-shadow: 0 0 12px #00eaff;
    }

    .hero {
      text-align: center;
      padding: 90px 20px 55px;
    }

    .hero small {
      color: #00eaff;
      letter-spacing: 3px;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 52px);
      margin: 22px 0;
      text-shadow: 0 0 25px #00eaff55;
    }

    .hero p {
      color: #aab6d8;
      line-height: 2;
    }

    .posts-container {
      width: min(1100px, 90%);
      margin: auto;
      padding-bottom: 90px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .post-card {
      background: linear-gradient(145deg, #17213d, #10152b);
      border: 1px solid #00eaff35;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 40px #0005;
      transition: transform .4s, box-shadow .4s;
      animation: appear .7s ease both;
    }

    .post-card:hover {
      transform: translateY(-9px) rotateX(2deg);
      box-shadow: 0 18px 45px #00eaff25;
      border-color: #00eaff;
    }

    .post-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .post-content {
      padding: 24px;
    }

    .post-content h2 {
      font-size: 21px;
      color: #00eaff;
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .post-body {
      color: #c5cde5;
      line-height: 2.2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-date {
      display: block;
      color: #8d9bbd;
      font-size: 12px;
      margin-top: 22px;
    }

    .status {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px 15px;
      color: #b7c5e8;
      line-height: 2.2;
    }

    footer {
      text-align: center;
      padding: 28px;
      border-top: 1px solid #ffffff18;
      color: #8290b3;
      line-height: 2;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
      }

      nav {
        justify-content: center;
        gap: 15px;
        font-size: 13px;
      }

      .hero {
        padding-top: 60px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="index.html">✦ Sana<span>Demo</span></a>

  <nav>
    <a href="index.html">خانه</a>
    <a href="features.html">امکانات</a>
    <a href="posts.html">مطالب</a>
    <a href="about.html">درباره ما</a>
    <a href="contact.html">ارتباط</a>
  </nav>
</header>

<section class="hero">
  <small>SADEMO DIGITAL CONTENT</small>
  <h1>مطالب SanaDemo</h1>
  <p>تازه‌ترین مطالب و نوشته‌های منتشرشده در SanaDemo</p>
</section>

<main class="posts-container" id="postsContainer">
  <div class="status">در حال دریافت مطالب...</div>
</main>

<footer>
  <strong>✦ SanaDemo</strong>
  <p>Independent Smart Web Experience</p>
  <p>© 2026 SanaDemo</p>
</footer>

<script>
  const SUPABASE_URL =
    "https://qtuhpiybzgaepdndjlvf.supabase.co";

  // کلید عمومی publishable پروژه خودت را اینجا قرار بده.
  // از کلید secret یا service_role استفاده نکن.
  const SUPABASE_PUBLIC_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );

  const container = document.getElementById("postsContainer");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  function formatDate(date) {
    return new Intl.DateTimeFormat("fa-IR", {
      dateStyle: "long",
      timeStyle: "short"
    }).format(new Date(date));
  }

  async function loadPosts() {
    container.innerHTML =
      '<div class="status">در حال دریافت مطالب...</div>';

    const { data, error } = await client
      .from("posts")
      .select("id, title, body, image_url, created_at")
      .eq("published", true)
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      container.innerHTML =
        '<div class="status">دریافت مطالب با مشکل مواجه شد. لطفاً بعداً دوباره تلاش کنید.</div>';
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="status">هنوز مطلب منتشرشده‌ای وجود ندارد.</div>';
      return;
    }

    container.innerHTML = data.map(post => `
      <article class="post-card">
        ${post.image_url ? `
          <img
            class="post-image"
            src="${escapeHTML(post.image_url)}"
            alt="${escapeHTML(post.title)}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        ` : ""}

        <div class="post-content">
          <h2>${escapeHTML(post.title)}</h2>

          <div class="post-body">${escapeHTML(post.body)}</div>

          <time class="post-date">
            ${escapeHTML(formatDate(post.created_at))}
          </time>
        </div>
      </article>
    `).join("");
  }

  loadPosts();
</script>

</body>
</html>
