
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه آزمایشی</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f1f3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 5px 25px #0001;
        }

        a {
            display: inline-block;
            background: #2457a7;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            text-decoration: none;
            margin: 15px;
        }

        .notice {
            color: #777;
            font-size: 13px;
            line-height: 2;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>صفحه آزمایشی</h2>

        <p>
            این صفحه فقط برای آزمایش هدایت به سامانه رسمی ثنا ساخته شده است.
        </p>

        <a href="https://sana.adliran.ir"
           target="_blank"
           rel="noopener noreferrer">
            ورود به سامانه رسمی ثنا
        </a>

        <p class="notice">
            این صفحه مستقل است و متعلق به قوه قضاییه نیست.
            هیچ اطلاعات شخصی دریافت یا ذخیره نمی‌شود.
        </p>
    </div>
</body>
</html>
